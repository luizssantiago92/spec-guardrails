<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Spec Guardrails phase flow: classify, optional elicit, three owner approvals, build loop, verify, archive, plus a quick lane">
  <rect width="900" height="330" rx="12" fill="#0d1117"/>
  <text x="450" y="30" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle" letter-spacing="1">SPEC GUARDRAILS FLOW</text>

  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Planning row -->
  <rect x="30" y="52" width="110" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="85" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Classify</text>
  <text x="85" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">size the change</text>

  <rect x="170" y="52" width="110" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="225" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Elicit</text>
  <text x="225" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">optional brief</text>

  <polygon points="330,78 360,58 390,78 360,98" fill="none" stroke="#d29922" stroke-width="2">
    <animate attributeName="stroke-width" values="2;3.2;2" keyTimes="0;0.5;1" dur="0.7s" begin="1.1s" fill="remove"/>
  </polygon>
  <path d="M352 78 l6 6 l10 -12" fill="none" stroke="#d29922" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1">
    <animate attributeName="opacity" values="0.25;1" keyTimes="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
  </path>
  <text x="360" y="118" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#d29922" text-anchor="middle">APPROVE</text>

  <rect x="410" y="52" width="110" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="465" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Specify</text>
  <text x="465" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">spec.md</text>

  <polygon points="550,78 580,58 610,78 580,98" fill="none" stroke="#d29922" stroke-width="2">
    <animate attributeName="stroke-width" values="2;3.2;2" keyTimes="0;0.5;1" dur="0.7s" begin="1.9s" fill="remove"/>
  </polygon>
  <path d="M572 78 l6 6 l10 -12" fill="none" stroke="#d29922" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1">
    <animate attributeName="opacity" values="0.25;1" keyTimes="0;1" dur="0.5s" begin="1.9s" fill="freeze"/>
  </path>
  <text x="580" y="118" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#d29922" text-anchor="middle">APPROVE</text>

  <rect x="630" y="52" width="110" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="685" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Tasks</text>
  <text x="685" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">tasks.md</text>

  <polygon points="770,78 800,58 830,78 800,98" fill="none" stroke="#d29922" stroke-width="2">
    <animate attributeName="stroke-width" values="2;3.2;2" keyTimes="0;0.5;1" dur="0.7s" begin="2.7s" fill="remove"/>
  </polygon>
  <path d="M792 78 l6 6 l10 -12" fill="none" stroke="#d29922" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1">
    <animate attributeName="opacity" values="0.25;1" keyTimes="0;1" dur="0.5s" begin="2.7s" fill="freeze"/>
  </path>
  <text x="800" y="118" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#d29922" text-anchor="middle">APPROVE</text>

  <!-- Planning arrows -->
  <path d="M140 78 H168" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M280 78 H328" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M390 78 H408" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M520 78 H548" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M610 78 H628" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M740 78 H768" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Into the build loop -->
  <path d="M830 78 H862 V132 H235 V150" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Execute row -->
  <rect x="170" y="152" width="130" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="235" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Build loop</text>
  <text x="235" y="192" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">test, implement, commit</text>

  <rect x="360" y="152" width="110" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="415" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Verify</text>
  <text x="415" y="192" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">validation.md</text>

  <rect x="530" y="152" width="110" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="585" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Archive</text>
  <text x="585" y="192" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">domain memory</text>

  <path d="M300 180 H358" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M470 180 H528" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Wave loop back -->
  <path d="M235 208 C235 258 120 258 120 182" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-blue)">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <text x="120" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">next wave</text>

  <!-- Travelling pulse: hidden in static renderers, visible only while animating -->
  <circle r="4" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="5.6s" repeatCount="indefinite"/>
    <animateMotion dur="5.6s" repeatCount="indefinite" calcMode="linear"
      path="M140 78 H830 L862 78 V132 H235 V148"/>
  </circle>
  <circle r="3.5" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="2.2s" repeatCount="indefinite"/>
    <animateMotion dur="2.2s" repeatCount="indefinite" calcMode="linear"
      path="M235 208 C235 258 120 258 120 182"/>
  </circle>

  <!-- Quick lane -->
  <rect x="330" y="248" width="540" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Quick lane (3 files or fewer)</text>
  <text x="600" y="288" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">build, verify, commit - no spec or tasks ceremony</text>
</svg>
