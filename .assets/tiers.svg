<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Complexity tiers: Quick, Simple, Medium, Complex and Parallel, with what each one creates and how many approvals it needs">
  <rect width="900" height="200" rx="12" fill="#0d1117"/>
  <text x="450" y="26" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle" letter-spacing="1">COMPLEXITY TIERS</text>

  <!-- Quick -->
  <rect x="20" y="44" width="160" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M20 54 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v18 h-160 z" fill="#238636"/>
  <text x="100" y="64" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">QUICK</text>
  <text x="100" y="96" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">3 files or fewer</text>
  <text x="100" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">code + quick evidence</text>
  <text x="100" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">no approvals</text>
  <text x="100" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">express lane</text>

  <!-- Simple -->
  <rect x="195" y="44" width="160" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M195 54 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v18 h-160 z" fill="#1f6feb"/>
  <text x="275" y="64" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SIMPLE</text>
  <text x="275" y="96" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">2 to 5 files</text>
  <text x="275" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">spec, code, validation</text>
  <text x="275" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">1 approval (spec)</text>

  <!-- Medium -->
  <rect x="370" y="44" width="160" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M370 54 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v18 h-160 z" fill="#8250df"/>
  <text x="450" y="64" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">MEDIUM</text>
  <text x="450" y="96" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">under 10 jobs</text>
  <text x="450" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">spec + tasks + archive</text>
  <text x="450" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">2 approvals</text>

  <!-- Complex -->
  <rect x="545" y="44" width="160" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M545 54 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v18 h-160 z" fill="#da3633"/>
  <text x="625" y="64" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">COMPLEX</text>
  <text x="625" y="96" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">APIs, architecture</text>
  <text x="625" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">adds design.md</text>
  <text x="625" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">2 to 3 approvals</text>

  <!-- Parallel -->
  <rect x="720" y="44" width="160" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M720 54 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v18 h-160 z" fill="#bf8700"/>
  <text x="800" y="64" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">PARALLEL</text>
  <text x="800" y="96" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">splittable work</text>
  <text x="800" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">adds task-graph.md</text>
  <text x="800" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">worktrees + merge owner</text>
</svg>
