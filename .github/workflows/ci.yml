name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run installer tests
        run: npm run test:node

      - name: Run gate tests
        run: npm run test:gates

      - name: Verify hub and sister skills exist
        run: |
          test -f skills/agent-architecture.md
          test -f skills/engineering-standards.md
          test -f skills/security-review.md
          test -f skills/appsec.md
          test -f skills/qa-strategy.md
          test -f skills/code-simplify.md
          test -f skills/ship-ready.md
          test -f skills/git-handoff.md
          test -f skills/task-graph-engineering.md
          test -f rules/engineering-baseline.mdc

      - name: Verify phase references exist
        run: |
          test -f skills/references/explore.md
          test -f skills/references/elicitation.md
          test -f skills/references/constitution.md
          test -f skills/references/specify.md
          test -f skills/references/discuss.md
          test -f skills/references/design.md
          test -f skills/references/tasks.md
          test -f skills/references/analyze.md
          test -f skills/references/implement.md
          test -f skills/references/validate.md
          test -f skills/references/converge.md
          test -f skills/references/archive.md
          test -f skills/references/project-init.md
          test -f skills/references/memory.md
          test -f skills/references/quick-mode.md
          test -f skills/references/context-limits.md
          test -f skills/references/lessons.md
          test -f skills/references/sub-agents.md

      - name: Verify gate scripts exist and compile
        run: |
          test -f scripts/_common.py
          test -f scripts/validate_spec.py
          test -f scripts/validate_tasks.py
          test -f scripts/validate_state.py
          test -f scripts/validate_traceability.py
          test -f scripts/validate_ship_surface.py
          test -f scripts/validate_quick.py
          test -f scripts/analyze_artifacts.py
          test -f scripts/loop_plan.py
          test -f scripts/check_commit.py
          test -f scripts/lessons.py
          python3 -m compileall -q scripts
          if npm pack --dry-run 2>&1 | grep -E '__pycache__|\.pyc'; then
            echo "bytecode must not ship in the npm package" >&2
            exit 1
          fi

  gates-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run gate tests
        run: npm run test:gates
