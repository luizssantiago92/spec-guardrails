name: Publish to npm

# Publishes the version already on main (no bump here).
# Owner flow: merge PR with package.json + CHANGELOG ## x.y.z → Actions → Publish.
#
# Manual dispatch only. A `release: published` trigger cannot work here: the
# `npm` environment allows the `main` branch only, and a release event runs on
# the tag ref, so the job is rejected before any step executes. Creating a
# GitHub release therefore must not attempt to publish.
on:
  workflow_dispatch:

concurrency:
  group: npm-publish-spec-guardrails
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Require main for manual publish
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Manual publish must run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: npm test

      - name: Require CHANGELOG section for package version
        id: version
        run: |
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! grep -q "^## ${VERSION}" docs/CHANGELOG.md; then
            echo "docs/CHANGELOG.md must include a ## ${VERSION} section before publish." >&2
            echo "Bump package.json version + CHANGELOG in a PR, merge to main, then re-run this workflow." >&2
            exit 1
          fi
          if npm view "${PKG}@${VERSION}" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${PKG}@${VERSION} is already on npm — skipping publish."
            echo "To ship new code: bump version + CHANGELOG, merge to main, then re-run."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "${PKG}@${VERSION} is not on npm yet — will publish."
          fi

      - name: Publish to npm
        if: steps.version.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Already published (success)
        if: steps.version.outputs.already_published == 'true'
        run: |
          echo "Nothing to do: ${{ steps.version.outputs.package }}@${{ steps.version.outputs.version }} is already on npm."
          echo "Merge a version bump if you expected to publish new changes."

      - name: Create and push git tag
        if: steps.version.outputs.already_published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skip."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
