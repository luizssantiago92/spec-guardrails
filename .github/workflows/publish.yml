name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type (patch, minor, major)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require main for manual publish
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual publish must run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: npm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: npm version "$VERSION_BUMP" -m "chore release"

      - name: Require CHANGELOG section for package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "^## ${VERSION}" docs/CHANGELOG.md; then
            echo "docs/CHANGELOG.md must include a ## ${VERSION} section before publish."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: git push origin main --follow-tags
