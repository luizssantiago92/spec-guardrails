name: Publish to npm

# Publishes the version already on main (no bump here).
# Owner flow: merge PR with package.json + CHANGELOG ## x.y.z → Actions → Publish.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require main for manual publish
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual publish must run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: npm test

      - name: Require CHANGELOG section for package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! grep -q "^## ${VERSION}" docs/CHANGELOG.md; then
            echo "docs/CHANGELOG.md must include a ## ${VERSION} section before publish."
            echo "Bump version + CHANGELOG in a PR, merge to main, then re-run this workflow."
            exit 1
          fi
          if npm view "@luizsantiago/spec-guardrails@$VERSION" version 2>/dev/null; then
            echo "npm already has @luizsantiago/spec-guardrails@$VERSION — refuse duplicate publish."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skip."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
